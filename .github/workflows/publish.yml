name: Publish Stable Release

# Publishes @smartmemory/stratum (the TS engine in ts/) to npm on a vX.Y.Z tag.
# Replaces the retired PyPI workflow (stratum-py / stratum-mcp were deleted in
# the 2026-07 TS cutover). Requires the NPM_TOKEN repo secret.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.1). Leave empty to use ts/package.json version.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=$(node -p "require('./ts/package.json').version.split('-')[0]")
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing stable version: $VERSION"

      - name: Update version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'ts/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install and build
        working-directory: ts
        run: npm install && npm run build

      # Publish gate: verify the package is well-formed and runnable, not the full
      # integration suite. The suite spawns real agent subprocesses and is timing/
      # environment-sensitive (needs codex auth, a sibling checkout, etc.), so it
      # flakes in CI and would randomly block releases. It runs on push/PR (test.yml)
      # and locally instead. Here we gate on types + build + a real MCP handshake.
      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Smoke the compiled bins (MCP handshake + CLI via symlink)
        working-directory: ts
        run: |
          # MCP bin answers the initialize handshake
          RESP=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | node dist/mcp/main.js)
          echo "$RESP"
          echo "$RESP" | grep -q '"serverInfo"' || { echo "MCP bin did not answer initialize"; exit 1; }
          # CLI bin must run THROUGH A SYMLINK (how npm/npx installs bins) — guards the
          # entrypoint-detection regression where argv[1] is the symlink, not the real file.
          ln -s "$PWD/dist/cli/stratum.js" "$RUNNER_TEMP/stratum"
          node "$RUNNER_TEMP/stratum" 2>&1 | grep -q "Usage: stratum" || { echo "CLI bin did not run via symlink"; exit 1; }

      - name: Publish to npm (stable)
        working-directory: ts
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "Stable release v${VERSION}" --latest || echo "Release may already exist"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## ✅ @smartmemory/stratum ${VERSION} published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Wire a consumer with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo '"stratum": { "command": "npx", "args": ["-y", "--package=@smartmemory/stratum@'"${VERSION}"'", "stratum-mcp"] }' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
