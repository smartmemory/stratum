name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # TS engine suite (ts/). Replaces the retired Python pytest suite — stratum-py
  # and stratum-mcp were deleted in the 2026-07 TS cutover. Live model/Docker
  # judge gates skip without OPENAI_API_KEY.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: ts
        run: npm install

      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Test
        working-directory: ts
        run: npm test
